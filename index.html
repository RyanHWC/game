function render2048(app){const g=games.find(x=>x.id==='2048');let board=Array(16).fill(0),score=0;function spawn(){let free=board.map((v,i)=>v? -1:i).filter(i=>i>=0);if(free.length)board[free[Math.floor(Math.random()*free.length)]]=Math.random()<.9?2:4}app.innerHTML=shell(g,`${title(g,'Use arrow keys or swipe/press the direction buttons to merge equal tiles.')}<div class="stats-row"><div class="stat-box"><strong id="m2048Score">0</strong><span>Score</span></div><div class="stat-box"><strong id="m2048Best">${data.best['2048']||'—'}</strong><span>Best tile</span></div><div class="stat-box"><strong>2048</strong><span>Goal</span></div></div><div id="m2048Board" class="number-grid" style="grid-template-columns:repeat(4,minmax(0,1fr));gap:7px"></div><div class="dpad"><span></span><button data-move="up">↑</button><span></span><button data-move="left">←</button><button data-move="down">↓</button><button data-move="right">→</button></div><div class="actions"><button class="btn primary" id="m2048New">New game</button></div>`);function paint(){const el=$('#m2048Board');el.innerHTML=board.map(v=>`<button style="min-height:60px;background:${v?'#'+({2:'26374a',4:'30465c',8:'67512d',16:'80522d',32:'853c5c',64:'9a3450',128:'6b4ca3',256:'4c5d9e',512:'287a83',1024:'317a54',2048:'baff79'}[v]||'31536b'):' #111927'};font-weight:1000;color:${v>=2048?'#07111b':'#f2f6ff'}" data-tile="${v}">${v||''}</button>`).join('')}function move(d){let old=board.slice();for(let r=0;r<4;r++){let idx=Array.from({length:4},(_,c)=>d==='left'||d==='right'?r*4+c:c*4+r);if(d==='right'||d==='down')idx.reverse();let vals=idx.map(i=>board[i]).filter(Boolean),out=[];for(let i=0;i<vals.length;i++){if(vals[i]===vals[i+1]){out.push(vals[i]*2);score+=vals[i]*2;i++}else out.push(vals[i])}while(out.length<4)out.push(0);idx.forEach((n,i)=>board[n]=out[i])}if(board.some((v,i)=>v!==old[i])){spawn();$('#m2048Score').textContent=score;let max=Math.max(...board);$('#m2048Best').textContent=max;best('2048',max,false);if(max>=2048)record('2048 Merge',score,'points');paint()}}function key(e){if(view!=='2048')return;const m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};if(m[e.key]){e.preventDefault();move(m[e.key])}}window.addEventListener('keydown',key);$$('[data-move]').forEach(b=>b.onclick=()=>move(b.dataset.move));let sx=0,sy=0;$('#m2048Board').ontouchstart=e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY};$('#m2048Board').ontouchend=e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>25)move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))};$('#m2048New').onclick=()=>render2048($('#app'));spawn();spawn();paint()}
function renderWhack(app){const g=games.find(x=>x.id==='whack');app.innerHTML=shell(g,`${title(g,'Tap the 🗿 or 🧠 tiles. Avoid the 💀. Score as much as you can in 15 seconds.')}<div class="stats-row"><div class="stat-box"><strong id="whackScore">0</strong><span>Score</span></div><div class="stat-box"><strong id="whackTime">15s</strong><span>Time</span></div><div class="stat-box"><strong id="whackState">Ready</strong><span>Status</span></div></div><div class="tap-tiles" id="whackTiles"></div><div class="actions"><button class="btn primary" id="whackStart">Start 15s round</button></div>`);let score=0,run=false;const memes=['🗿','🧠','🔥','💀','🚽','🐸','🗿','✨','💀'];function shuffle(){let a=memes.slice().sort(()=>Math.random()-.5);$('#whackTiles').innerHTML=a.map((m,i)=>`<button data-whack="${i}">${m}</button>`).join('');$$('[data-whack]').forEach(b=>b.onclick=()=>{if(!run)return;if(b.textContent==='💀'){score=Math.max(0,score-2)}else score++;$('#whackScore').textContent=score;shuffle()})}$('#whackStart').onclick=()=>{timers.forEach(id=>{clearTimeout(id);clearInterval(id)});timers=[];score=0;run=true;let start=Date.now();$('#whackState').textContent='Go!';$('#whackScore').textContent='0';shuffle();every(()=>{let left=Math.max(0,15-(Date.now()-start)/1000);$('#whackTime').textContent=left.toFixed(1)+'s';if(left<=0){run=false;$('#whackState').textContent='Done';best('whack',score,false);record('Whack-a-Brainrot',score,'points')}},100)};shuffle()}
function renderDodge(app){const g=games.find(x=>x.id===view);app.innerHTML=shell(g,`${title(g,view==='coin'?'Collect 🪙 and avoid 💀. Tap left/right to move.':'Dodge incoming brainrot chaos. Tap left/right to move.') }<div class="stats-row"><div class="stat-box"><strong id="dodgeScore">0</strong><span>Score</span></div><div class="stat-box"><strong id="dodgeState">Ready</strong><span>Status</span></div><div class="stat-box"><strong>⬅️➡️</strong><span>Controls</span></div></div><div id="dodgeArena" class="arena" style="height:300px;background:#101727"><div id="dodgePlayer" style="position:absolute;bottom:12px;left:46%;font-size:32px">${view==='coin'?'👺':'🗿'}</div></div><div class="actions"><button class="btn" id="dodgeLeft">⬅️ Left</button><button class="btn" id="dodgeRight">Right ➡️</button><button class="btn primary" id="dodgeStart">Start / restart</button></div>`);let x=46,score=0,run=false,items=[];function move(dx){x=Math.max(0,Math.min(90,x+dx));$('#dodgePlayer').style.left=x+'%'}$('#dodgeLeft').onclick=()=>move(-8);$('#dodgeRight').onclick=()=>move(8);function finish(){run=false;$('#dodgeState').textContent='Game over';best(view,score,false);record(g.name,score,'points')}$('#dodgeStart').onclick=()=>{timers.forEach(id=>{clearTimeout(id);clearInterval(id)});timers=[];run=true;x=46;score=0;items=[];$('#dodgeScore').textContent='0';$('#dodgeState').textContent='Playing';$('#dodgeArena').querySelectorAll('.falling').forEach(e=>e.remove());every(()=>{if(!run||!(view==='skibidi'||view==='coin'))return;const a=$('#dodgeArena');if(Math.random()<.32){const el=document.createElement('div');el.className='falling';el.textContent=view==='coin'?(Math.random()<.6?'🪙':'💀'):['🚽','💀','🔥','🗿'][Math.floor(Math.random()*4)];el.style.cssText=`position:absolute;top:0;left:${Math.random()*90}%;font-size:26px`;a.append(el);items.push({el,y:0,x:parseFloat(el.style.left)})}items.forEach(it=>{it.y+=5;it.el.style.top=it.y+'px';if(it.y>265){if(Math.abs(it.x-x)<12){if(view==='coin'&&it.el.textContent==='🪙')score+=3;else if(view!=='coin')score++;else score=Math.max(0,score-2);$('#dodgeScore').textContent=score;it.el.remove();it.dead=true}}if(it.y>290){it.el.remove();it.dead=true}});items=items.filter(i=>!i.dead);if(score>0&&Math.random()<.003)finish()},55)} }
function renderSigma(app){const g=games.find(x=>x.id==='sigma');app.innerHTML=shell(g,`${title(g,'Tap to drop the moving block. Land it on the tower to stack aura.')}<div class="stats-row"><div class="stat-box"><strong id="sigmaScore">0</strong><span>Stack</span></div><div class="stat-box"><strong id="sigmaState">Ready</strong><span>Status</span></div><div class="stat-box"><strong>🗿</strong><span>Aura</span></div></div><div id="sigmaTower" class="arena" style="height:320px;background:#111827"></div><div class="actions"><button class="btn primary" id="sigmaStart">Start / drop</button></div>`);let score=0,run=false,x=0,dir=1,w=100,stack=[];function paint(){const a=$('#sigmaTower');a.innerHTML=stack.map((b,i)=>`<div style="position:absolute;left:${b.x}px;bottom:${i*18}px;width:${b.w}px;height:18px;background:${['#5ee7ff','#ac8bff','#ff7cb7','#baff79','#ffc36b'][i%5]};border-radius:4px"></div>`).join('')+`<div id="sigmaMoving" style="position:absolute;left:${x}px;bottom:${stack.length*18}px;width:${w}px;height:18px;background:#fff;border-radius:4px"></div>`}$('#sigmaStart').onclick=()=>{if(!run){timers.forEach(id=>{clearTimeout(id);clearInterval(id)});timers=[];score=0;w=100;x=20;dir=1;stack=[{x:Math.max(20,($('#sigmaTower').clientWidth-100)/2),w:100}];run=true;$('#sigmaState').textContent='Playing';$('#sigmaScore').textContent='0';paint()}else{let base=stack[stack.length-1],left=Math.max(x,base.x),right=Math.min(x+w,base.x+base.w),nw=right-left;if(nw<18){run=false;$('#sigmaState').textContent='Tower fell';best('sigma',score,false);record('Sigma Stack',score,'blocks');return}score++;w=nw;x=left;stack.push({x,w});$('#sigmaScore').textContent=score;paint()}};every(()=>{if(!run||view!=='sigma'){run=false;return}x+=dir*3;if(x<0||x+w>$('#sigmaTower').clientWidth)dir*=-1;const m=$('#sigmaMoving');if(m)m.style.left=x+'px'},30)}
function renderPong(app){const g=games.find(x=>x.id==='pong');app.innerHTML=shell(g,`${title(g,'Move your finger or mouse to control the paddle. Keep the ball in play.')}<div class="stats-row"><div class="stat-box"><strong id="pongHits">0</strong><span>Returns</span></div><div class="stat-box"><strong id="pongState">Ready</strong><span>Status</span></div><div class="stat-box"><strong>🏓</strong><span>Paddle</span></div></div><canvas id="pongCanvas" class="game-canvas" width="360" height="300" style="margin-top:12px"></canvas><div class="actions"><button class="btn primary" id="pongStart">Start / restart</button></div>`);const c=$('#pongCanvas'),ctx=c.getContext('2d');let x=180,y=130,dx=2.4,dy=2.8,p=145,score=0,run=false;function draw(){ctx.clearRect(0,0,360,300);ctx.strokeStyle='#32465e';ctx.setLineDash([5,6]);ctx.beginPath();ctx.moveTo(0,150);ctx.lineTo(360,150);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#5ee7ff';ctx.fillRect(p,270,70,8);ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);ctx.fillStyle='#baff79';ctx.fill();if(!run||view!=='pong')return;x+=dx;y+=dy;if(x<7||x>353)dx*=-1;if(y<7)dy=Math.abs(dy);if(y>260&&x>p&&x<p+70){dy=-Math.abs(dy);score++;$('#pongHits').textContent=score}if(y>300){run=false;$('#pongState').textContent='Missed!';best('pong',score,false);record('Pocket Pong',score,'returns');draw();return}requestAnimationFrame(draw)}function move(e){const r=c.getBoundingClientRect();p=Math.max(0,Math.min(290,(e.clientX-r.left)/r.width*360-35))}c.addEventListener('pointermove',move);c.addEventListener('pointerdown',move);$('#pongStart').onclick=()=>{x=180;y=130;dx=2.4;dy=2.8;score=0;run=true;$('#pongHits').textContent='0';$('#pongState').textContent='Playing';draw()};draw()}
